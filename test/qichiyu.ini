[custom]
; ==========================================================
; 原地址：https://github.com/hong9587/qichiyurule/blob/main/metafenliu.ini
; 电报群：https://t.me/qichiyuchat
; 自动测速：支持
; 应用分流：支持
; 增强中国IP段：支持
; 增强国外GFW：支持
; 节点过滤：支持
; DNS防泄露：95%常用网站已经做到防泄露，冷门网站会漏
; ==========================================================
; 方案 · 合并增强版（保留 Adobe REJECT + 冷门节点）
; - 使用 GEOSITE / GEOIP 作为主要规则来源
; - 保留 HK / TW / JP / SG / US 五个 url-test 体系
; - 新增：🧊 冷门节点（排除五大区）
; - Adobe 提供 REJECT（可禁止联网）
; - 加入 FCM / Copilot / OneDrive 等应用支持
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Expire|Official|Website

; ==========================================================
; 规则集定义（自上而下优先级）
; ==========================================================

; --- Adobe 屏蔽（最高优先级）---
; 注意：如需在 OpenClash 中完全屏蔽 Adobe，还需在【流量控制】→
; 【绕过指定区域 IPv4 黑名单】中添加：adobe.com、adobelogin.com、adobe.io、behance.net
ruleset=🟥 Adobe,[]GEOSITE,adobe
ruleset=🟥 Adobe,[]GEOIP,adobe,no-resolve

; --- 私网直连 ---
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve

; --- 国内直连 ---
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve

; --- 国内可用 / 下载 / BT ---
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

;------------ 请在下方区域内添加应用规则 ------------

; --- Aethersailor 直连补丁 ---
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/coolcya/Aethersailor-Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/coolcya/Aethersailor-Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

; --- Aethersailor 代理补丁（仅兜底用）---
ruleset=🚀 节点选择,clash-domain:https://testingcf.jsdelivr.net/gh/coolcya/Aethersailor-Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 节点选择,clash-classic:https://testingcf.jsdelivr.net/gh/coolcya/Aethersailor-Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; --- 核心应用 ---
ruleset=📦 Notion,[]GEOSITE,Notion
ruleset=📦 Notion,[]GEOIP,Notion,no-resolve

ruleset=📲 Telegram,[]GEOSITE,telegram
ruleset=📲 Telegram,[]GEOIP,telegram,no-resolve

ruleset=🤖 AI,[]GEOSITE,openai
ruleset=🤖 AI,[]GEOSITE,category-ai-!cn

ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=📹 YouTube,[]GEOSITE,youtube
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve

ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=🎵 TikTok,[]GEOIP,tiktok,no-resolve
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter

ruleset=👨🏿‍💻 GitHub,[]GEOSITE,github
ruleset=👨🏿‍💻 GitHub,[]GEOIP,github,no-resolve

ruleset=♻️ Speedtest,[]GEOSITE,category-speedtest

ruleset=🎮 游戏平台,[]GEOSITE,steam

; --- 交易所 ---
ruleset=🟦 OKX,[]GEOSITE,okx
ruleset=🟨 Binance,[]GEOSITE,binance
ruleset=🟪 Bybit,[]GEOSITE,bybit

; --- 社交 / 通讯 ---
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn

; --- Google / Microsoft / Cloudflare ---
ruleset=☁️ CloudFlareCDN,[]GEOSITE,cloudflare
ruleset=☁️ CloudFlareCDN,[]GEOIP,cloudflare,no-resolve

ruleset=🍀 Google,[]GEOSITE,google
ruleset=🍀 Google,[]GEOIP,google,no-resolve

ruleset=🪟 Microsoft,[]GEOSITE,microsoft
ruleset=🪟 Microsoft,[]GEOIP,microsoft,no-resolve

; --- FCM（Google 推送）---
ruleset=📢 FCM,[]GEOSITE,googlefcm
ruleset=📢 FCM,[]GEOIP,googlefcm,no-resolve

; --- GFW 兜底 ---
ruleset=🚀 节点选择,[]GEOSITE,gfw

; --- 非标端口 ---
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/coolcya/Aethersailor-Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

;------------ 请在上方区域内添加应用规则 ------------

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL


