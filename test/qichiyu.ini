; ==========================================================
; Default / 漏网之鱼（唯一允许全节点的组）
; ==========================================================

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 加坡节点`[]🇺🇲 美国节点`[]🧊 冷门节点`[]🐸 手动切换`[]🎯 全球直连

custom_proxy_group=🌐 Default`select`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 加坡节点`[]🇺🇲 美国节点`[]🧊 冷门节点`[]♻️ 自动选择`[]🐸 手动切换`[]🎯 全球直连

custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]🎯 全球直连`[]♻️ 自动选择`[]🧊 冷门节点`[]🐸 手动切换`[]🚀 节点选择

; ==========================================================
; 非标端口
; ==========================================================

custom_proxy_group=🔀 非标端口`select`[]🐟 遵循规则`[]🎯 全球直连
custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼

; ==========================================================
; 国家节点测速组 + 冷门节点池
; ==========================================================

; 全节点手动选择
custom_proxy_group=🐸 手动切换`select`.*

; 自动选择（全节点测速）
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 五区 url-test 自动选择
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)(🇭🇰|香港|\\bHK\\b|hongkong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾节点`url-test`(?i)(🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)(🇯🇵|日本|\\bJP\\b|tokyo|osaka)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 加坡节点`url-test`(?i)(🇸🇬|新加坡|\\bSG\\b|singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(?i)(🇺🇸|美国|\\bUS\\b|united states|los angeles|san jose|seattle|new york)`http://www.gstatic.com/generate_204`300,,50

; 冷门节点池（排除 HK/JP/TW/US/SG）
custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(🇭🇰|香港|\\bHK\\b|hong\\s*kong|🇯🇵|日本|\\bJP\\b|tokyo|osaka|🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet|🇸🇬|新加坡|\\bSG\\b|singapore|🇺🇸|美国|\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)).*


